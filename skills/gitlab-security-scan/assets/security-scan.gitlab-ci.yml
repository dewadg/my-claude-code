# Security scan jobs to merge into the target's .gitlab-ci.yml. Placeholders:
#   <pkg>          package label used in the job name ("sast <pkg>"); slug becomes sast-<pkg>
#   <pkg-dir>      package directory (e.g. packages/api)
#   <other-dirs>   every OTHER package directory, comma-separated
#   <lockfile-N>   one -L per lockfile / manifest osv-scanner should read
#   <group/proj>   the project's full path on GitLab
# Delete the blocks the target does not want. Keep `test` as the first stage.

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - project: renovate-bot/renovate-runner
    ref: v26.1.0
    file: /templates/renovate.gitlab-ci.yml

stages:
  - test

# --- sast ----------------------------------------------------------
# One Semgrep SAST job per package, run in parallel on every push to the default
# branch (a merged MR) and never on tags. Each job scans the whole checkout minus
# the other packages (SAST_EXCLUDED_PATHS), so findings land in a per-package
# gl-sast-report.json. Tests, e2e and build configs (*.config.*) are excluded from
# every scan. The template's own repo-wide jobs are switched off. Project ruleset
# files need Ultimate ("ruleset customization not enabled"), so false positives
# get inline nosemgrep comments. Each job also keeps its report as
# scan-reports/<job slug>.json so `scan report` can tell them apart.
.sast-package:
  extends: semgrep-sast
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  after_script:
    - mkdir -p scan-reports && cp gl-sast-report.json "scan-reports/$CI_JOB_NAME_SLUG.json"
  artifacts:
    paths:
      - scan-reports/
  variables:
    SAST_COMMON_EXCLUDED_PATHS: "spec, test, tests, __tests__, tmp, node_modules, dist, vendor, .claude, .notes, openspec, deploy, docs, *_test.go, e2e, *.config.js, *.config.cjs, *.config.mjs, *.config.mts, *.config.ts"

semgrep-sast:
  rules:
    - when: never

gitlab-advanced-sast:
  rules:
    - when: never

sast <pkg>:
  extends: .sast-package
  variables:
    SAST_EXCLUDED_PATHS: "$SAST_COMMON_EXCLUDED_PATHS, <other-dirs>"

# --- dependency scan -----------------------------------------------
# Scans the lockfiles against the OSV database with a pinned osv-scanner. Runs only
# on pushes to the default branch (a merged MR), never in MR pipelines or on tags, so
# a finding never blocks development. Each lockfile is passed explicitly so a missing
# one fails the job instead of being skipped. Go findings go through call analysis
# (needs the Go toolchain, hence the golang image): advisories whose vulnerable code is
# never called do not fail the gating scan; a last, informational pass lists them.
# Accepted risks live in .gitlab/osv-scanner.toml, each with a reason and an expiry
# date. A first, non-gating pass saves every finding as JSON for `scan report`.
dependency scan:
  stage: test
  image: golang:1.27-alpine
  variables:
    GOMODCACHE: "$CI_PROJECT_DIR/.go/pkg/mod"
  cache:
    key:
      files:
        - <pkg-dir>/go.sum            # no Go module: use `key: osv-scanner-v2.7.0` instead
    paths:
      - .go/pkg/mod
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
    - mkdir -p scan-reports
    - >
      osv-scanner scan source --config .gitlab/osv-scanner.toml --format json
      --output-file scan-reports/osv-scanner.json
      -L <lockfile-1>
      -L <lockfile-2> || true
    - >
      osv-scanner scan source --config .gitlab/osv-scanner.toml
      -L <lockfile-1>
      -L <lockfile-2>
    # Informational only (never gates): prints the Go findings call analysis marks as uncalled.
    # Go modules only; drop this line when there is none.
    - osv-scanner scan source --config .gitlab/osv-scanner.toml --all-vulns -L <pkg-dir>/go.mod || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - scan-reports/

# --- scan report ---------------------------------------------------
# Folds the SAST and dependency scan outputs into one JUnit report, shown in the
# pipeline's Tests tab: one suite per scan, a failed case per finding, a skipped case
# per uncalled Go advisory, an error case when a scan left no report. Runs even when a
# scan fails and never gates. Conversion lives in .gitlab/scan-junit.py; its arguments
# after the output file are the report names, one per scan job.
scan report:
  stage: test
  image: python:3.13-alpine
  needs:
    - sast <pkg>
    - dependency scan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
  script:
    - python3 .gitlab/scan-junit.py scan-report.xml sast-<pkg> osv-scanner
  artifacts:
    when: always
    reports:
      junit: scan-report.xml

# --- renovate ------------------------------------------------------
# Opens dependency update merge requests (config in renovate.json). The job comes from
# the renovate-runner template and runs in scheduled pipelines and on pushes to the
# default branch, never in MR pipelines or on tags. It authenticates with the masked,
# protected RENOVATE_TOKEN project variable. The template's default Renovate image is
# overridden with a pinned version, and its `deploy` stage with `test`, alongside the
# security scans.
renovate:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    CI_RENOVATE_IMAGE: renovate/renovate:44.190.2
    RENOVATE_REPOSITORIES: <group/proj>
    RENOVATE_ONBOARDING: "false"
